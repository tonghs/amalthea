    - title: ڪاپي رائيٽنگ ترتيب آهي
      desc: ڪاپي رائيٽنگ ۽ ٽيمپليٽ الڳ الڳ آهن. توهان کي ڪاپي کي تبديل ڪرڻ لاء ڪوڊ کي ڇڪڻ جي ضرورت ناهي.
    - title: خودڪار ترجمو
      desc: صرف چيني ڪاپي برقرار رکي ٿي، ۽ ان کي وڌ ۾ وڌ ٻين ٻولين ۾ ترجمو ڪري سگهجي ٿو هڪ واحد حڪم سان.
    - title: صفر رن ٽائم
      desc: صرف HTML ۽ CSS ڪڍي ٿو ۽ ڪنهن به جامد هوسٽنگ تي ترتيب ڏئي سگهجي ٿو.