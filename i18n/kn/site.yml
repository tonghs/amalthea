description: ನಕಲು ಬರೆಯಲು yml ಬಳಸಿ, ಟೆಂಪ್ಲೇಟ್‌ಗಳನ್ನು ಬರೆಯಲು ಪಗ್ ಬಳಸಿ ಮತ್ತು ಪ್ರತಿ ಭಾಷೆಯಲ್ಲಿ ಸ್ಥಿರ ಪುಟವನ್ನು ನಿರ್ಮಿಸಿ.
lang: ಭಾಷೆ ಬದಲಿಸಿ
close: ಮುಚ್ಚುವಿಕೆ
theme:
  title: ಥೀಮ್
  system: ವ್ಯವಸ್ಥೆಯನ್ನು ಅನುಸರಿಸಿ
  light: ತಿಳಿ ಬಣ್ಣ
  dark: ಕತ್ತಲು
hero:
  title: ಒಂದು ಪ್ರತಿ, ಹಲವು ಭಾಷೆಗಳು
  desc: ನಕಲನ್ನು ಬರೆಯಲು yml ಮತ್ತು ಟೆಂಪ್ಲೇಟ್‌ಗಳನ್ನು ಬರೆಯಲು ಪಗ್ ಅನ್ನು ಬಳಸಿ. ನಿರ್ಮಿಸಿದ ನಂತರ, ನೀವು ಪ್ರತಿ ಭಾಷೆಗೆ ಸಂಪೂರ್ಣವಾಗಿ ಸ್ಥಿರ ಪುಟವನ್ನು ಪಡೆಯುತ್ತೀರಿ.
  cta: ವೈಶಿಷ್ಟ್ಯಗಳನ್ನು ವೀಕ್ಷಿಸಿ
features:
  title: ವೈಶಿಷ್ಟ್ಯದ ಮುಖ್ಯಾಂಶಗಳು
  li:
    - title: ಕಾಪಿರೈಟಿಂಗ್ ಎನ್ನುವುದು ಕಾನ್ಫಿಗರೇಶನ್ ಆಗಿದೆ
      desc: ಕಾಪಿರೈಟಿಂಗ್ ಮತ್ತು ಟೆಂಪ್ಲೆಟ್ಗಳನ್ನು ಪ್ರತ್ಯೇಕಿಸಲಾಗಿದೆ. ನಕಲನ್ನು ಬದಲಾಯಿಸಲು ನೀವು ಕೋಡ್ ಅನ್ನು ಸ್ಪರ್ಶಿಸುವ ಅಗತ್ಯವಿಲ್ಲ.
    - title: ಸ್ವಯಂಚಾಲಿತ ಅನುವಾದ
      desc: ಚೈನೀಸ್ ನಕಲನ್ನು ಮಾತ್ರ ನಿರ್ವಹಿಸಲಾಗುತ್ತದೆ ಮತ್ತು ಅದನ್ನು ಒಂದೇ ಆಜ್ಞೆಯೊಂದಿಗೆ ಇತರ ಭಾಷೆಗಳಿಗೆ ಹೆಚ್ಚುತ್ತಿರುವ ಭಾಷಾಂತರಿಸಬಹುದು.
    - title: ಶೂನ್ಯ ರನ್ಟೈಮ್
      desc: HTML ಮತ್ತು CSS ಅನ್ನು ಮಾತ್ರ ಔಟ್‌ಪುಟ್ ಮಾಡುತ್ತದೆ ಮತ್ತು ಯಾವುದೇ ಸ್ಥಿರ ಹೋಸ್ಟಿಂಗ್‌ಗೆ ನಿಯೋಜಿಸಬಹುದು.