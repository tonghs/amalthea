description: কপি লিখিবলৈ yml ব্যৱহাৰ কৰক, সাঁচ লিখিবলৈ pug ব্যৱহাৰ কৰক, আৰু প্ৰতিটো ভাষাত এটা স্থিতিশীল পৃষ্ঠা নিৰ্মাণ কৰক।
lang: ভাষা সলনি কৰক
close: বন্ধ কৰা
theme:
  title: বিষয়বস্তু
  system: ব্যৱস্থাটো অনুসৰণ কৰক
  light: পাতল ৰং
  dark: অন্ধকাৰ
hero:
  title: এটা কপি, বহু ভাষা
  desc: কপি লিখিবলৈ yml আৰু টেমপ্লেট লিখিবলৈ pug ব্যৱহাৰ কৰক। নিৰ্মাণ কৰাৰ পিছত প্ৰতিটো ভাষাত এটা বিশুদ্ধ স্থিতিশীল পৃষ্ঠা পাব।
  cta: বৈশিষ্ট্যসমূহ চাওক
features:
  title: বৈশিষ্ট্য হাইলাইটসমূহ
  li:
    - title: কপিৰাইটিং হৈছে বিন্যাস
      desc: কপিৰাইটিং আৰু টেমপ্লেট পৃথক কৰা হৈছে। কপি সলনি কৰিবলৈ ক’ডটো স্পৰ্শ কৰাৰ প্ৰয়োজন নাই।
    - title: স্বয়ংক্ৰিয় অনুবাদ
      desc: কেৱল চীনা কপিহে ৰখা হয়, আৰু ইয়াক এটা আদেশৰ সহায়ত ক্ৰমান্বয়ে অন্য ভাষালৈ অনুবাদ কৰিব পাৰি।
    - title: শূন্য ৰানটাইম
      desc: কেৱল HTML আৰু CSS আউটপুট কৰে আৰু যিকোনো স্থিতিশীল হস্টিঙলৈ মোতায়েন কৰিব পাৰি।