description: ໃຊ້ yml ເພື່ອຂຽນສໍາເນົາ, ໃຊ້ pug ເພື່ອຂຽນແມ່ແບບ, ແລະສ້າງຫນ້າຄົງທີ່ໃນແຕ່ລະພາສາ.
lang: ສະ​ຫຼັບ​ພາ​ສາ​
close: ປິດ
theme:
  title: ຫົວຂໍ້
  system: ປະຕິບັດຕາມລະບົບ
  light: ສີອ່ອນ
  dark: ມືດ
hero:
  title: ສະບັບດຽວ, ຫຼາຍພາສາ
  desc: ໃຊ້ yml ເພື່ອຂຽນສໍາເນົາແລະ pug ເພື່ອຂຽນແມ່ແບບ. ຫຼັງ​ຈາກ​ການ​ກໍ່​ສ້າງ​, ທ່ານ​ຈະ​ໄດ້​ຮັບ​ຫນ້າ​ຄົງ​ທີ່​ຢ່າງ​ດຽວ​ຕໍ່​ພາ​ສາ​.
  cta: ເບິ່ງຄຸນສົມບັດ
features:
  title: ຈຸດເດັ່ນຂອງຄຸນສົມບັດ
  li:
    - title: Copywriting ແມ່ນການຕັ້ງຄ່າ
      desc: Copywriting ແລະແມ່ແບບແມ່ນແຍກອອກ. ທ່ານບໍ່ຈຳເປັນຕ້ອງແຕະລະຫັດເພື່ອປ່ຽນສຳເນົາ.
    - title: ການແປພາສາອັດຕະໂນມັດ
      desc: ພຽງແຕ່ສໍາເນົາຈີນຖືກຮັກສາໄວ້, ແລະມັນສາມາດຖືກແປເປັນພາສາອື່ນໆເພີ່ມຂຶ້ນດ້ວຍຄໍາສັ່ງດຽວ.
    - title: ບໍ່ມີເວລາແລ່ນ
      desc: ຜົນໄດ້ຮັບພຽງແຕ່ HTML ແລະ CSS ແລະສາມາດຖືກນໍາໄປໃຊ້ກັບໂຮດຕິ້ງແບບຄົງທີ່.