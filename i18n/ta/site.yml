description: நகலை எழுத yml ஐப் பயன்படுத்தவும், டெம்ப்ளேட்களை எழுத பக் பயன்படுத்தவும் மற்றும் ஒவ்வொரு மொழியிலும் நிலையான பக்கத்தை உருவாக்கவும்.
lang: மொழி மாறவும்
close: மூடல்
theme:
  title: தீம்
  system: அமைப்பைப் பின்பற்றவும்
  light: ஒளி நிறம்
  dark: இருள்
hero:
  title: ஒரு பிரதி, பல மொழிகள்
  desc: நகலை எழுத yml ஐப் பயன்படுத்தவும் மற்றும் டெம்ப்ளேட்களை எழுத பக். கட்டிய பிறகு, ஒரு மொழிக்கு முற்றிலும் நிலையான பக்கத்தைப் பெறுவீர்கள்.
  cta: அம்சங்களைக் காண்க
features:
  title: அம்சம் சிறப்பம்சங்கள்
  li:
    - title: நகல் எழுதுதல் என்பது கட்டமைப்பு
      desc: நகல் எழுதுதல் மற்றும் வார்ப்புருக்கள் பிரிக்கப்பட்டுள்ளன. நகலை மாற்ற, குறியீட்டைத் தொட வேண்டியதில்லை.
    - title: தானியங்கி மொழிபெயர்ப்பு
      desc: சீன நகல் மட்டுமே பராமரிக்கப்படுகிறது, மேலும் இது ஒரு கட்டளையுடன் மற்ற மொழிகளில் படிப்படியாக மொழிபெயர்க்கப்படலாம்.
    - title: பூஜ்ஜிய இயக்க நேரம்
      desc: HTML மற்றும் CSS ஐ மட்டுமே வெளியிடுகிறது மற்றும் எந்த நிலையான ஹோஸ்டிங்கிலும் பயன்படுத்த முடியும்.