description: yml을 사용하여 사본을 작성하고, pug를 사용하여 템플릿을 작성하고, 각 언어로 정적 페이지를 구축합니다.
lang: 언어 전환
close: 폐쇄
theme:
  title: 주제
  system: 시스템을 따르세요
  light: 연한 색
  dark: 어두운
hero:
  title: 하나의 사본, 다양한 언어
  desc: 사본을 작성하려면 yml을 사용하고 템플릿을 작성하려면 pug를 사용하십시오. 빌드 후에는 언어별로 순전히 정적 페이지를 얻게 됩니다.
  cta: 기능 보기
features:
  title: 주요 기능
  li:
    - title: 카피라이팅은 구성이다
      desc: 카피라이팅과 템플릿이 분리되어 있습니다. 사본을 변경하기 위해 코드를 터치할 필요가 없습니다.
    - title: 자동 번역
      desc: 중국어 사본만 유지되며, 단일 명령으로 다른 언어로 점진적으로 번역할 수 있습니다.
    - title: 런타임 제로
      desc: HTML과 CSS만 출력하며 모든 정적 호스팅에 배포할 수 있습니다.