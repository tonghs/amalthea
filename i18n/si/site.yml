description: පිටපත් ලිවීමට yml භාවිතා කරන්න, අච්චු ලිවීමට pug භාවිතා කරන්න, සහ එක් එක් භාෂාවෙන් ස්ථිතික පිටුවක් තැනීම.
lang: භාෂාව මාරු කරන්න
close: වසා දැමීම
theme:
  title: තේමාව
  system: පද්ධතිය අනුගමනය කරන්න
  light: සැහැල්ලු වර්ණය
  dark: අඳුරු
hero:
  title: එක් පිටපතක්, බොහෝ භාෂා
  desc: පිටපත් ලිවීමට yml සහ අච්චු ලිවීමට pug භාවිතා කරන්න. ගොඩනැගීමෙන් පසු, ඔබට එක් භාෂාවකට තනිකරම ස්ථිතික පිටුවක් ලැබේ.
  cta: විශේෂාංග බලන්න
features:
  title: විශේෂාංග ඉස්මතු කිරීම්
  li:
    - title: පිටපත් ලිවීම යනු වින්‍යාස කිරීමයි
      desc: පිටපත් ලිවීම සහ සැකිලි වෙන් කර ඇත. පිටපත වෙනස් කිරීමට ඔබට කේතය ස්පර්ශ කිරීමට අවශ්‍ය නැත.
    - title: ස්වයංක්රීය පරිවර්තනය
      desc: චීන පිටපතක් පමණක් පවත්වාගෙන යනු ලබන අතර, එය තනි විධානයකින් වෙනත් භාෂාවලට වර්ධක ලෙස පරිවර්තනය කළ හැක.
    - title: ශුන්ය ධාවන කාලය
      desc: HTML සහ CSS පමණක් ප්‍රතිදානය කරන අතර ඕනෑම ස්ථිතික සත්කාරකයකට යෙදවිය හැක.