  desc: ڪاپي لکڻ لاءِ yml استعمال ڪريو ۽ ٽيمپليٽ لکڻ لاءِ پگ. تعمير ڪرڻ کان پوء، توھان حاصل ڪريو خالص جامد صفحو في ٻولي.
