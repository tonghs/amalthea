description: નકલ લખવા માટે yml નો ઉપયોગ કરો, ટેમ્પલેટો લખવા માટે pug નો ઉપયોગ કરો અને દરેક ભાષામાં સ્થિર પૃષ્ઠ બનાવો.
lang: ભાષા બદલો
close: બંધ
theme:
  title: થીમ
  system: સિસ્ટમ અનુસરો
  light: આછો રંગ
  dark: શ્યામ
hero:
  title: એક નકલ, ઘણી ભાષાઓ
  desc: નકલ લખવા માટે yml અને નમૂનાઓ લખવા માટે pug નો ઉપયોગ કરો. બનાવ્યા પછી, તમને ભાષા દીઠ એક સંપૂર્ણ સ્થિર પૃષ્ઠ મળે છે.
  cta: લક્ષણો જુઓ
features:
  title: લક્ષણ હાઇલાઇટ્સ
  li:
    - title: કૉપિરાઇટિંગ એ રૂપરેખાંકન છે
      desc: કૉપિરાઇટિંગ અને ટેમ્પલેટ્સને અલગ કરવામાં આવ્યા છે. કૉપિ બદલવા માટે તમારે કોડને સ્પર્શ કરવાની જરૂર નથી.
    - title: આપોઆપ અનુવાદ
      desc: ફક્ત ચાઇનીઝ નકલ જાળવવામાં આવે છે, અને તે એક જ આદેશ સાથે અન્ય ભાષાઓમાં વધારાના અનુવાદ કરી શકાય છે.
    - title: શૂન્ય રનટાઇમ
      desc: આઉટપુટ માત્ર HTML અને CSS અને કોઈપણ સ્ટેટિક હોસ્ટિંગ પર જમાવવામાં આવી શકે છે.