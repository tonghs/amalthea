description: Користите имл за писање копије, користите пуг за писање шаблона и направите статичну страницу на сваком језику.
lang: промени језик
close: затварање
theme:
  title: тема
  system: Пратите систем
  light: светле боје
  dark: Дарк
hero:
  title: Један примерак, много језика
  desc: Користите имл за писање цопи и пуг за писање шаблона. Након изградње, добијате чисто статичну страницу по језику.
  cta: Погледајте карактеристике
features:
  title: Феатуре Хигхлигхтс
  li:
    - title: Копирајт је конфигурација
      desc: Цопивритинг и шаблони су одвојени. Не морате да додирнете код да бисте променили копију.
    - title: аутоматски превод
      desc: Одржава се само кинески примерак и може се постепено преводити на друге језике једном командом.
    - title: зеро рунтиме
      desc: Излази само ХТМЛ и ЦСС и може се применити на било који статички хостинг.