description: కాపీని వ్రాయడానికి ymlని ఉపయోగించండి, టెంప్లేట్‌లను వ్రాయడానికి పగ్‌ని ఉపయోగించండి మరియు ప్రతి భాషలో స్టాటిక్ పేజీని రూపొందించండి.
lang: భాష మారండి
close: మూసివేత
theme:
  title: థీమ్
  system: వ్యవస్థను అనుసరించండి
  light: లేత రంగు
  dark: చీకటి
hero:
  title: ఒక కాపీ, అనేక భాషలు
  desc: కాపీని వ్రాయడానికి yml మరియు టెంప్లేట్‌లను వ్రాయడానికి పగ్ ఉపయోగించండి. నిర్మించిన తర్వాత, మీరు ఒక్కో భాషకు పూర్తిగా స్టాటిక్ పేజీని పొందుతారు.
  cta: లక్షణాలను వీక్షించండి
features:
  title: ఫీచర్ ముఖ్యాంశాలు
  li:
    - title: కాపీ రైటింగ్ అనేది కాన్ఫిగరేషన్
      desc: కాపీ రైటింగ్ మరియు టెంప్లేట్‌లు వేరు చేయబడ్డాయి. కాపీని మార్చడానికి మీరు కోడ్‌ను తాకాల్సిన అవసరం లేదు.
    - title: స్వయంచాలక అనువాదం
      desc: చైనీస్ కాపీ మాత్రమే నిర్వహించబడుతుంది మరియు దానిని ఒకే ఆదేశంతో ఇతర భాషలలోకి అనువదించవచ్చు.
    - title: సున్నా రన్‌టైమ్
      desc: HTML మరియు CSSలను మాత్రమే అవుట్‌పుట్ చేస్తుంది మరియు ఏదైనా స్టాటిక్ హోస్టింగ్‌కు అమలు చేయవచ్చు.