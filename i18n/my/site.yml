description: ကော်ပီရေးရန် yml ကိုသုံးပါ၊ နမူနာပုံစံများရေးရန် pug ကိုသုံးကာ ဘာသာစကားတစ်ခုစီတွင် static page တစ်ခုတည်ဆောက်ပါ။
lang: ဘာသာစကားပြောင်းပါ။
close: ပိတ်ခြင်း။
theme:
  title: အပြင်အဆင်
  system: စနစ်ကို လိုက်နာပါ။
  light: အလင်းအရောင်
  dark: အမှောင်
hero:
  title: တစ်စောင်၊ ဘာသာစကားများစွာ
  desc: နမူနာပုံစံများရေးရန် ကော်ပီနှင့် pug ရေးရန် yml ကိုသုံးပါ။ တည်ဆောက်ပြီးနောက်၊ သင်သည် ဘာသာစကားတစ်ခုစီအတွက် ရိုးရှင်းသောစာမျက်နှာကို ရရှိမည်ဖြစ်သည်။
  cta: အသွင်အပြင်ကိုကြည့်ပါ။
features:
  title: အသွင်အပြင်များ
  li:
    - title: Copywriting သည် configuration ဖြစ်သည်။
      desc: မူပိုင်ခွင့်နှင့် ပုံစံများကို ခွဲခြားထားသည်။ ကော်ပီပြောင်းရန် ကုဒ်ကိုထိရန် မလိုအပ်ပါ။
    - title: အလိုအလျောက်ဘာသာပြန်ခြင်း။
      desc: တရုတ်ကော်ပီကိုသာ ထိန်းသိမ်းထားပြီး ၎င်းကို အမိန့်တစ်ခုတည်းဖြင့် အခြားဘာသာစကားများသို့ တိုးမြင့်ပြန်ဆိုနိုင်သည်။
    - title: သုည runtime
      desc: HTML နှင့် CSS တို့ကိုသာ ထုတ်ပေးပြီး မည်သည့် static hosting တွင်မဆို အသုံးပြုနိုင်သည်။