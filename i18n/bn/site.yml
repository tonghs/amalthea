description: কপি লিখতে yml ব্যবহার করুন, টেমপ্লেট লিখতে pug ব্যবহার করুন এবং প্রতিটি ভাষায় একটি স্ট্যাটিক পৃষ্ঠা তৈরি করুন।
lang: ভাষা পরিবর্তন করুন
close: বন্ধ
theme:
  title: থিম
  system: সিস্টেম অনুসরণ করুন
  light: হালকা রঙ
  dark: অন্ধকার
hero:
  title: এক কপি, অনেক ভাষা
  desc: কপি লিখতে yml এবং টেমপ্লেট লিখতে pug ব্যবহার করুন। নির্মাণের পরে, আপনি প্রতি ভাষাতে একটি সম্পূর্ণরূপে স্ট্যাটিক পৃষ্ঠা পাবেন।
  cta: বৈশিষ্ট্য দেখুন
features:
  title: বৈশিষ্ট্য হাইলাইট
  li:
    - title: কপিরাইটিং হল কনফিগারেশন
      desc: কপিরাইটিং এবং টেমপ্লেট আলাদা করা হয়। অনুলিপি পরিবর্তন করতে আপনাকে কোডটি স্পর্শ করতে হবে না।
    - title: স্বয়ংক্রিয় অনুবাদ
      desc: শুধুমাত্র চীনা কপি রক্ষণাবেক্ষণ করা হয়, এবং এটি একটি একক কমান্ডের সাহায্যে ক্রমবর্ধমানভাবে অন্যান্য ভাষায় অনুবাদ করা যেতে পারে।
    - title: শূন্য রানটাইম
      desc: আউটপুট শুধুমাত্র HTML এবং CSS এবং যে কোনো স্ট্যাটিক হোস্টিং স্থাপন করা যেতে পারে.