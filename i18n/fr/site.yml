features:
  title: Points forts des fonctionnalités
  li:
    - title: La rédaction est une configuration
      desc: La rédaction et les modèles sont séparés. Vous n’avez pas besoin de toucher au code pour modifier la copie.
    - title: traduction automatique
      desc: Seule la copie chinoise est conservée et elle peut être traduite progressivement dans d'autres langues avec une seule commande.
    - title: zéro exécution
      desc: Produit uniquement du HTML et du CSS et peut être déployé sur n'importe quel hébergement statique.