description: yml で文言を、pug でテンプレートを書き、言語ごとに静的ページを生成します。
lang: 言語を切り替え
close: 閉じる
theme:
  title: テーマ
  system: システム設定に合わせる
  light: ライト
  dark: ダーク
hero:
  title: ひとつの原稿を、多言語に
  desc: 文言は yml、テンプレートは pug で書きます。ビルドすると、言語ごとに純粋な静的ページができあがります。
  cta: 機能を見る
features:
  title: 主な機能
  li:
    - title: 文言は設定ファイル
      desc: 文言とテンプレートは分離しています。文言の修正にコードは不要です。
    - title: 自動翻訳
      desc: 中国語の文言だけを管理すれば、コマンド 1 つで他の言語へ差分翻訳できます。
    - title: ランタイムゼロ
      desc: HTML と CSS だけを出力します。どの静的ホスティングにもデプロイできます。