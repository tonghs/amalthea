  light: हल्के रंग
  dark: अँधेरा
hero:
  title: एक प्रति, अनेक भाषाएँ
  desc: कॉपी लिखने के लिए yml और टेम्प्लेट लिखने के लिए पग का उपयोग करें। निर्माण के बाद, आपको प्रति भाषा एक पूर्णतः स्थिर पृष्ठ मिलता है।
  cta: विशेषताएँ देखें
features:
  title: फ़ीचर हाइलाइट्स
  li:
    - title: कॉपी राइटिंग कॉन्फ़िगरेशन है
      desc: कॉपी राइटिंग और टेम्प्लेट अलग हो गए हैं। कॉपी बदलने के लिए आपको कोड को छूने की ज़रूरत नहीं है।
    - title: स्वचालित अनुवाद
      desc: केवल चीनी प्रति ही रखी जाती है, और इसे एक ही आदेश से क्रमिक रूप से अन्य भाषाओं में अनुवादित किया जा सकता है।
    - title: शून्य रनटाइम
      desc: केवल HTML और CSS आउटपुट करता है और इसे किसी भी स्थिर होस्टिंग पर तैनात किया जा सकता है।