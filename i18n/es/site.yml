features:
  title: Características destacadas
  li:
    - title: La redacción publicitaria es configuración.
      desc: La redacción publicitaria y las plantillas están separadas. No es necesario tocar el código para cambiar la copia.
    - title: traducción automática
      desc: Solo se mantiene la copia en chino y se puede traducir incrementalmente a otros idiomas con un solo comando.
