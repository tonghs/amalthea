<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- 外层宿主机：与内层完全一致的纯橙色值 -->
    <linearGradient id="host-grad" gradientUnits="userSpaceOnUse" x1="34" y1="20" x2="222" y2="236">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>

    <!-- 内层虚拟机：与外层完全一致的纯橙色值 -->
    <linearGradient id="vm-unified" gradientUnits="userSpaceOnUse" x1="70" y1="62" x2="186" y2="183">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
  </defs>

  <!-- 外层宿主机 -->
  <g>
    <polygon points="128,20 221.5,74 221.5,182 128,236 34.5,182 34.5,74" fill="none" stroke="url(#host-grad)" stroke-width="20" stroke-linejoin="miter" stroke-miterlimit="10" />
    <g fill="url(#host-grad)">
      <polygon points="43.5,68.8 72.6,85.6 72.6,96 63.6,101.2 34.5,84.4 34.5,74" />
      <polygon points="212.5,68.8 183.4,85.6 183.4,96 192.4,101.2 221.5,84.4 221.5,74" />
      <polygon points="119,230.8 119,197.2 128,192 137,197.2 137,230.8 128,236" />
    </g>
  </g>

  <!-- 内层虚拟机 -->
  <g fill="url(#vm-unified)">
    <polygon points="128,61.6 166.1,83.6 166.1,95.6 128,117.6 89.9,95.6 89.9,83.6" />
    <polygon points="80.9,111.2 119,133.2 119,177.2 108.6,183.2 70.5,161.2 70.5,117.2" />
    <polygon points="137,133.2 175.1,111.2 185.5,117.2 185.5,161.2 147.4,183.2 137,177.2" />
  </g>
</svg>