description: Χρησιμοποιήστε το yml για να γράψετε αντίγραφο, χρησιμοποιήστε το pug για να γράψετε πρότυπα και να δημιουργήσετε μια στατική σελίδα σε κάθε γλώσσα.
lang: αλλαγή γλώσσας
close: κλείσιμο
theme:
  title: θέμα
  system: Ακολουθήστε το σύστημα
  light: ανοιχτό χρώμα
  dark: Σκοτάδι
hero:
  title: Ένα αντίγραφο, πολλές γλώσσες
  desc: Χρησιμοποιήστε το yml για να γράψετε αντίγραφο και το pug για να γράψετε πρότυπα. Μετά τη δημιουργία, λαμβάνετε μια καθαρά στατική σελίδα ανά γλώσσα.
  cta: Προβολή χαρακτηριστικών
features:
  title: Χαρακτηριστικά γνωρίσματα
  li:
    - title: Το copywriting είναι διαμόρφωση
      desc: Το copywriting και τα πρότυπα διαχωρίζονται. Δεν χρειάζεται να αγγίξετε τον κωδικό για να αλλάξετε το αντίγραφο.
    - title: αυτόματη μετάφραση
      desc: Διατηρείται μόνο το κινεζικό αντίγραφο και μπορεί να μεταφραστεί σταδιακά σε άλλες γλώσσες με μία μόνο εντολή.
    - title: μηδενικός χρόνος εκτέλεσης
      desc: Εξάγει μόνο HTML και CSS και μπορεί να αναπτυχθεί σε οποιαδήποτε στατική φιλοξενία.